[tool.ruff]
line-length = 130
# Lambda code is imported as cloud_photos.<group>, with lambda/ as the import root.
src = ["lambda"]

[tool.ruff.lint]
# Pin the rule set explicitly so that ruff upgrades do not change it.
# These are ruff's former default rules.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["lambda", "scripts"]
extraPaths = ["lambda"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
