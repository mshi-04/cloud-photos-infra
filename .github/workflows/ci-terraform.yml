name: "Terraform CI"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
    paths:
      - 'envs/**'
      - 'modules/**'
      - 'lambda/**'
      - 'scripts/**'
      - 'bootstrap/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.terraform-version'
      - '.tflint.hcl'
      - 'pyproject.toml'

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  # id-token: write  # Required when the plan job is restored.
  contents: read
  # pull-requests: write  # Required when the plan job is restored.

jobs:
  trivy:
    name: "Terraform Security Scan"
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  lint-lambda:
    name: "Lambda Lint"
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-dev

      - name: Run ruff check
        run: ruff check lambda scripts

      - name: Run ruff format check
        if: ${{ !cancelled() }}
        run: ruff format --check lambda scripts

      - name: Run Pyright
        if: ${{ !cancelled() }}
        run: pyright

  test-lambda:
    name: "Lambda Unit Tests"
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-dev

      - name: Run tests
        working-directory: lambda
        run: pytest

      # Build the ZIPs twice with the pinned SAM image, the same path as CD.
      # The same inputs must give the same hashes, so that plan shows no change for unchanged code.
      - name: Build Lambda packages and layers twice
        id: build_packages
        if: ${{ !cancelled() }}
        run: |
          for build in 1 2; do
            python scripts/build_lambda.py --output-dir "$RUNNER_TEMP/build-$build" --with-layers
          done
          diff <(cd "$RUNNER_TEMP/build-1" && sha256sum *.zip) <(cd "$RUNNER_TEMP/build-2" && sha256sum *.zip)

      # Import every handler from the ZIPs alone, with the layer for the group that uses it.
      - name: Verify Lambda packages
        if: ${{ !cancelled() && steps.build_packages.outcome == 'success' }}
        run: |
          pip install --quiet --target "$RUNNER_TEMP/runtime-deps" boto3
          python scripts/verify_lambda_packages.py \
            --zip-dir "$RUNNER_TEMP/build-1" \
            --runtime-deps "$RUNNER_TEMP/runtime-deps" \
            --layer "push_notification=$RUNNER_TEMP/build-1/firebase_admin_layer.zip"

  fmt:
    name: "Format Check"
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform

      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Every method, integration and response must feed the redeployment trigger of the API.
      - name: Check API deployment inputs
        run: python3 scripts/check_api_deployment_inputs.py

      - name: Check Lambda role names in bootstrap
        run: python3 scripts/check_lambda_role_names.py

  tflint:
    name: "Terraform Lint"
    runs-on: ubuntu-26.04
    # The job runs a third-party action and needs only to read the repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.58.0

      # The bundled terraform ruleset needs no plugin download or AWS credentials.
      - name: Run tflint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

