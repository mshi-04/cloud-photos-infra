name: Setup Python development environment
description: Install Python and the cached Lambda development dependencies.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          lambda/requirements-dev.txt
          lambda/layers/firebase_admin/requirements.txt

    # Dependency versions are shared by lint and test jobs and local development.
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: python -m pip install -r lambda/requirements-dev.txt
